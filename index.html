<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل سنة وإنتِ طيبة يا لمى</title>
<style>
  :root{
    --sky-top:#ffd6e8;
    --sky-mid:#ffb8d6;
    --sky-bot:#ff9cc4;
    --cloud:#ffffff;
    --accent:#ff5c8d;
    --text:#a1305a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 55%,var(--sky-bot));
    overflow:hidden;
    color:var(--text);
  }

  /* ---------- Moving background clouds ---------- */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg-cloud{
    position:absolute;left:-30%;
    width:var(--w);height:calc(var(--w)*.36);
    background:#fff;border-radius:999px;opacity:.7;
    filter:drop-shadow(0 8px 14px rgba(255,92,141,.15));
    animation:drift var(--d) linear infinite;animation-delay:var(--delay);
  }
  .bg-cloud::before,.bg-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .bg-cloud::before{width:45%;height:130%;top:-60%;left:15%}
  .bg-cloud::after{width:35%;height:105%;top:-40%;right:15%}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(160vw)}}

  /* ---------- Stage ---------- */
  .stage{
    position:relative;z-index:1;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }

  /* Greeting cloud */
  .greeting{
    position:relative;width:min(600px,90vw);margin-top:70px;
    isolation:isolate;
    animation:float 5s ease-in-out infinite;
  }
  /* The cloud: one soft base + overlapping round puffs, all behind the text */
  .cloud-shape{
    position:absolute;inset:0;z-index:-1;
    filter:drop-shadow(0 14px 22px rgba(255,92,141,.28)) drop-shadow(0 0 1px rgba(255,255,255,.9));
  }
  .cloud-shape i{position:absolute;display:block;background:#fff;border-radius:50%;aspect-ratio:1}
  .cloud-shape .base{inset:6% 0 4% 0;aspect-ratio:auto;border-radius:100px}
  .cloud-shape .p1{width:28%;left:6%;top:-12%}
  .cloud-shape .p2{width:42%;left:27%;top:-30%}
  .cloud-shape .p3{width:30%;right:6%;top:-14%}
  .cloud-shape .p4{width:22%;left:-4%;bottom:-3%}
  .cloud-shape .p5{width:24%;right:-4%;bottom:-5%}
  .cloud-shape .p6{width:26%;left:37%;bottom:-9%}

  .greeting-content{position:relative;padding:58px 44px 62px}
  .greeting h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.5;color:var(--accent);text-shadow:0 2px 0 rgba(255,255,255,.8)}
  .greeting .love{margin-top:12px;font-size:clamp(1.05rem,3.4vw,1.35rem);font-weight:600;line-height:1.8}
  .greeting .love2{margin-top:4px;font-size:clamp(.95rem,3vw,1.15rem);color:#c4527e;line-height:1.8}
  @keyframes float{50%{transform:translateY(-10px)}}

  .hint{
    margin-top:28px;font-size:1.05rem;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,.75);padding:10px 20px;border-radius:999px;
    border:0;color:var(--text);font-family:inherit;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:scale(1.06)}}

  /* ---------- Three-cloud button reveal ---------- */
  .reveal{
    position:relative;width:min(340px,80vw);margin-top:28px;display:flex;
    align-items:center;justify-content:center;
  }
  .reveal.show{display:flex}
  .reveal .btn{
    position:relative;z-index:1;background:#e5173f;color:#fff;border:0;border-radius:999px;
    padding:16px 38px;font-size:1.3rem;font-family:inherit;font-weight:700;cursor:pointer;
    box-shadow:0 8px 20px rgba(229,23,63,.45);transition:transform .15s;
  }
  .reveal .btn:active{transform:scale(.94)}
  .rc{
    position:absolute;z-index:2;width:46%;height:70%;background:#fff;border-radius:999px;
    box-shadow:0 8px 18px rgba(255,92,141,.25);
    transition:transform 1.4s cubic-bezier(.6,.05,.3,1),opacity 1.4s ease;
  }
  .rc.c1{left:0}.rc.c2{left:27%;top:6%}.rc.c3{right:0}
  .reveal.open .c1{transform:translateX(-140%) rotate(-8deg);opacity:0}
  .reveal.open .c2{transform:translateY(-160%) scale(1.1);opacity:0}
  .reveal.open .c3{transform:translateX(140%) rotate(8deg);opacity:0}
  .reveal .btn{animation:pulse 2s ease-in-out infinite}

  .reveal .btn.done{background:linear-gradient(135deg,#ff5c8d,#ff9ccb);box-shadow:0 8px 22px rgba(255,92,141,.5)}
  .reveal .btn.pop{animation:pop .5s ease}
  @keyframes pop{40%{transform:scale(1.25) rotate(-4deg)}70%{transform:scale(.95) rotate(3deg)}}

  .surprise{
    margin-top:20px;max-width:min(460px,88vw);padding:18px 26px;border-radius:28px;
    background:rgba(255,255,255,.85);color:var(--accent);
    font-size:clamp(1.05rem,3.4vw,1.35rem);font-weight:700;line-height:1.8;
    box-shadow:0 10px 26px rgba(255,92,141,.3);
    opacity:0;transform:translateY(20px) scale(.9);pointer-events:none;
    transition:opacity .8s,transform .8s cubic-bezier(.2,1.4,.4,1);
  }
  .surprise.show{opacity:1;transform:none}
  .surprise small{display:block;margin-top:6px;font-size:.85em;color:var(--text);font-weight:600}

  /* ---------- Poem card ---------- */
  .poem-overlay{
    position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(255,160,200,.28);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .6s;
  }
  .poem-overlay.open{opacity:1;pointer-events:auto}
  .poem-card{
    position:relative;width:min(520px,92vw);max-height:82vh;overflow-y:auto;
    padding:30px 22px 26px;border-radius:32px;text-align:center;
    background:linear-gradient(180deg,#fff,#fff4f9);
    box-shadow:0 18px 44px rgba(161,48,90,.35);
    transform:translateY(30px) scale(.94);transition:transform .7s cubic-bezier(.2,1.3,.4,1);
  }
  .poem-overlay.open .poem-card{transform:none;animation:glow 2.6s ease-in-out infinite .8s}
  @keyframes glow{
    0%,100%{box-shadow:0 18px 44px rgba(161,48,90,.35),0 0 0 0 rgba(255,92,141,.0)}
    50%{box-shadow:0 18px 50px rgba(161,48,90,.4),0 0 38px 8px rgba(255,92,141,.45)}
  }
  .poem-card h2{font-size:clamp(1.3rem,4.5vw,1.7rem);color:var(--accent);margin-bottom:14px;animation:beat 1.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
  .floatup{
    position:absolute;bottom:-8vh;left:var(--x);font-size:var(--s);line-height:1;opacity:0;
    animation:floatup var(--t) ease-in forwards;
    filter:drop-shadow(0 2px 4px rgba(255,92,141,.4));
  }
  @keyframes floatup{
    0%{transform:translate(0,0) scale(.6) rotate(0);opacity:0}
    12%{opacity:1}
    85%{opacity:.9}
    100%{transform:translate(var(--sway),-115vh) scale(1.15) rotate(var(--r));opacity:0}
  }
  .poem-close{
    position:absolute;top:12px;left:14px;width:32px;height:32px;border:0;border-radius:50%;
    background:#ffe0ee;color:var(--text);font-size:15px;cursor:pointer;
  }
  .bayt{
    padding:10px 0;opacity:0;transform:translateY(12px);
    font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:2;
  }
  .bayt + .bayt{border-top:1px dashed rgba(255,92,141,.3)}
  .bayt span{display:block}
  .bayt .a{color:var(--text);font-weight:700}
  .bayt .b{color:#c4527e}
  .poem-overlay.open .bayt{animation:baytIn .8s ease forwards;animation-delay:var(--d)}
  @keyframes baytIn{to{opacity:1;transform:none}}
  @media (max-width:800px){
    .poem-overlay{align-items:flex-start;padding-top:124px}
    .poem-card{max-height:calc(100dvh - 144px)}
  }

  /* ---------- Party poppers + confetti canvas ---------- */
  #confetti{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
  .popper{
    position:fixed;bottom:12px;z-index:7;font-size:clamp(38px,9vw,56px);line-height:1;
    pointer-events:none;transform-origin:bottom center;
    animation:popper 1.6s ease forwards;
  }
  .popper.l{left:10px}
  .popper.r{right:10px;--flip:-1}
  @keyframes popper{
    0%{transform:scaleX(var(--flip,1)) scale(.2) rotate(0);opacity:0}
    15%{transform:scaleX(var(--flip,1)) scale(1.4) rotate(-12deg);opacity:1}
    30%{transform:scaleX(var(--flip,1)) scale(1) rotate(0)}
    80%{opacity:1}
    100%{transform:scaleX(var(--flip,1)) scale(1);opacity:0}
  }

  /* ---------- Falling hearts / emojis / bursts ---------- */
  .fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
  .drop{
    position:absolute;top:-8vh;left:var(--x);font-size:var(--s);line-height:1;
    animation:fall var(--t) linear forwards;will-change:transform;
    filter:drop-shadow(0 2px 3px rgba(255,92,141,.35));
  }
  @keyframes fall{
    0%{transform:translate(0,0) rotate(0)}
    50%{transform:translate(var(--sway),55vh) rotate(calc(var(--r)/2))}
    100%{transform:translate(0,112vh) rotate(var(--r))}
  }
  .burst{
    position:absolute;left:var(--x0);top:var(--y0);font-size:var(--s);line-height:1;
    animation:burst var(--t) cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes burst{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
    70%{opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}
  }
  .balloon{
    position:absolute;bottom:-12vh;left:var(--x);font-size:var(--s);
    animation:rise var(--t) ease-in forwards;
  }
  @keyframes rise{
    0%{transform:translate(0,0)}
    50%{transform:translate(var(--sway),-60vh)}
    100%{transform:translate(0,-125vh)}
  }

  /* ---------- Vinyl player (top-right) ---------- */
  .player{
    position:fixed;top:14px;right:14px;z-index:10;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:10px 10px 8px;border-radius:22px;
    background:rgba(255,255,255,.55);backdrop-filter:blur(6px);
    box-shadow:0 8px 22px rgba(161,48,90,.25);
    direction:ltr;
  }
  .vinyl{
    --size:92px;
    position:relative;width:var(--size);height:var(--size);border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%,transparent 0 22%,#000 22.5% 100%),
      repeating-radial-gradient(circle at 50% 50%,#1a1a1a 0 2px,#050505 2px 4px);
    box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 0 0 2px #222;
    animation:spin 4s linear infinite;
    animation-play-state:paused;
  }
  .vinyl::before{ /* light sheen to show rotation */
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0 20%,rgba(255,255,255,.18) 25%,transparent 30% 70%,rgba(255,255,255,.14) 75%,transparent 80%);
  }
  .vinyl .label{
    position:absolute;top:50%;left:50%;width:34%;height:34%;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#ff8fb8 13% 100%);
    box-shadow:0 0 0 2px rgba(255,255,255,.6);
  }
  .vinyl.playing{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}

  .pbtn{
    width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:#fff;font-size:13px;line-height:30px;
    box-shadow:0 3px 8px rgba(255,92,141,.5);
  }
  .pnote{
    display:none;max-width:120px;font-size:10.5px;line-height:1.3;color:var(--text);
    direction:rtl;text-align:center;
  }
  .player.missing .pnote{display:block}

  @media (max-width:600px){
    .player{top:8px;right:8px;padding:7px 7px 6px}
    .vinyl{--size:64px}
    .pbtn{width:26px;height:26px;line-height:26px;font-size:11px}
    .stage{padding-top:130px;justify-content:flex-start}
    .greeting{margin-top:50px}
    .greeting-content{padding:48px 26px 52px}
  }
  @media (prefers-reduced-motion:reduce){
    .bg-cloud,.greeting,.hint{animation:none}
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="bg-cloud" style="--w:220px;--d:60s;--delay:-10s;top:8%"></div>
  <div class="bg-cloud" style="--w:300px;--d:80s;--delay:-40s;top:30%"></div>
  <div class="bg-cloud" style="--w:180px;--d:50s;--delay:-25s;top:62%"></div>
  <div class="bg-cloud" style="--w:260px;--d:90s;--delay:-60s;top:80%"></div>
</div>

<!-- Birthday music player (top-right) -->
<div class="player" id="player">
  <div class="vinyl" id="vinyl" aria-hidden="true"><div class="label"></div></div>
  <button class="pbtn" id="playBtn" aria-label="تشغيل / إيقاف الموسيقى">▶</button>
  <div class="pnote">أضف ملف الأغنية في: <b id="srcName"></b></div>
  <!--
    AUDIO SOURCE: put your birthday song at  assets/birthday-song.mp3
    (or change AUDIO_SRC in the script below).
  -->
  <audio id="bgm" loop preload="auto"></audio>
</div>

<main class="stage">
  <section class="greeting">
    <div class="cloud-shape" aria-hidden="true">
      <i class="base"></i><i class="p1"></i><i class="p2"></i><i class="p3"></i>
      <i class="p4"></i><i class="p5"></i><i class="p6"></i>
    </div>
    <div class="greeting-content">
      <h1>كل سنة وإنتِ طيبة يا لمى 🎂</h1>
      <p class="love">يا أجمل غيمة في سمايا، وأحلى حاجة في أيامي 💕</p>
      <p class="love2">ربنا يسعد قلبك زي ما بتسعدي قلبي 🌸</p>
    </div>
  </section>

  <div class="reveal" id="reveal">
    <button class="btn" id="surpriseBtn">اضغطني 🎁</button>
  </div>

</main>

<!-- Poem shown after pressing the red button -->
<div class="poem-overlay" id="poemOverlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="poem-card">
    <button class="poem-close" id="poemClose" aria-label="إغلاق">✕</button>
    <h2>💌 إلى لمى 💌</h2>
    <div id="poem"></div>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="fx" id="fx" aria-hidden="true"></div>
<!-- effects layer above the poem card -->
<div class="fx" id="fx2" aria-hidden="true" style="z-index:9"></div>

  const audio   = document.getElementById("bgm");
  const vinyl   = document.getElementById("vinyl");
  const playBtn = document.getElementById("playBtn");
  const player  = document.getElementById("player");
  document.getElementById("srcName").textContent = AUDIO_SRC.startsWith("data:") ? "الأغنية المدمجة" : AUDIO_SRC;

  audio.src = AUDIO_SRC;

  // Vinyl state is driven only by the audio's real events
  audio.addEventListener("play",  () => { vinyl.classList.add("playing");    playBtn.textContent = "⏸"; });
  audio.addEventListener("pause", () => { vinyl.classList.remove("playing"); playBtn.textContent = "▶"; });

  let started = false;      // music has been auto-started once
  function startMusicOnce(){
    if (started) return;    // never restart on later clicks
    started = true;
    audio.play().catch(() => { /* blocked or file missing: stay paused */ });
  }

  playBtn.addEventListener("click", (e) => {
    e.stopPropagation();

    if (audio.paused) audio.play().catch(() => {}); else audio.pause();

  /* ---------- Red button ---------- */
  const surpriseBtn = document.getElementById("surpriseBtn");
  const fx = document.getElementById("fx");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isSmall = innerWidth < 600;

  const EMOJIS  = ["💖","💗","💕","💞","🌸","🎀","✨","🦋","🌷","🧸","🍓","🎈","⭐","💝","🩷","🫶","🎂","🎉"];
  const rand    = (a, b) => a + Math.random() * (b - a);
  const pick    = arr => arr[Math.floor(Math.random() * arr.length)];

  function spawn(cls, emoji, props, life, parent = fx){
    const el = document.createElement("span");
    el.className = cls;
    el.textContent = emoji;
    for (const k in props) el.style.setProperty(k, props[k]);
    parent.appendChild(el);
    setTimeout(() => el.remove(), life * 1000 + 300);
  }

  function dropOne(){
    const t = rand(5, 9);
    spawn("drop", pick(EMOJIS), {
      "--x": rand(0, 96) + "vw",
      "--s": rand(18, 36) + "px",
      "--t": t + "s",
      "--sway": rand(-40, 40) + "px",
      "--r": rand(-360, 360) + "deg"
    }, t);
  }

  // Burst of emojis exploding out of the button
  function burstFromButton(){
    const r = surpriseBtn.getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    const n = isSmall ? 22 : 34;
    for (let i = 0; i < n; i++){
      const ang = rand(0, Math.PI * 2), dist = rand(90, isSmall ? 190 : 300);
      const t = rand(1.1, 1.9);
      spawn("burst", pick(EMOJIS), {
        "--x0": x0 + "px", "--y0": y0 + "px",
        "--dx": Math.cos(ang) * dist + "px",
        "--dy": Math.sin(ang) * dist - 40 + "px",
        "--s": rand(18, 34) + "px",
        "--r": rand(-200, 200) + "deg",
        "--t": t + "s"
      }, t);
    }
  }

  // Balloons rising from the bottom
  function balloons(){
    const n = isSmall ? 5 : 8;
    for (let i = 0; i < n; i++){
      const t = rand(6, 10);
      setTimeout(() => spawn("balloon", pick(["🎈","🎈","🎀"]), {
        "--x": rand(2, 92) + "vw", "--s": rand(34, 56) + "px",
        "--t": t + "s", "--sway": rand(-50, 50) + "px"
      }, t), i * 220);
    }
  }

  // Heavy shower at first, then a gentle ongoing rain
  let rainTimer = null;
  function startRain(){
    if (rainTimer) return;
    let ticks = 0;
    const loop = () => {
      const heavy = ticks < 40;                 // ~ first 8 seconds
      const batch = heavy ? (isSmall ? 2 : 3) : 1;
      for (let i = 0; i < batch; i++) dropOne();
      ticks++;
      rainTimer = setTimeout(loop, heavy ? 200 : 650);
    };
    loop();
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ clearTimeout(rainTimer); rainTimer = null; }
    else if (surpriseBtn.classList.contains("done")) startRain();
  });

  /* ---------- Poem ---------- */
  const POEM = [
    "اليومَ عيدُكِ يا لمى،|والفرحُ يرقصُ في سماكِ",
    "والدنيا كلُّها تبتسمُ،|لأنها تحبُّ لقاكِ",
    "وجهُكِ جميلٌ كالقمرِ،|يُنيرُ الليلَ إذا رآكِ",
    "وعيناكِ نجمتانِ،|تسحرانِ كلَّ مَن يراكِ",

  /* ----- poem effects: heart explosion, sparkles per verse, rising hearts ----- */
  const fx2 = document.getElementById("fx2");
  const LOVE = ["💖","💗","💕","💞","❤️","🩷","💘","💝","✨","🌸"];
  let poemTimers = [], upTimer = null;

  function popFrom(x0, y0, n, minD, maxD, minS, maxS){
    for (let i = 0; i < n; i++){
      const ang = rand(0, Math.PI * 2), dist = rand(minD, maxD), t = rand(1.1, 2.1);
      spawn("burst", pick(LOVE), {
        "--x0": x0 + "px", "--y0": y0 + "px",
        "--dx": Math.cos(ang) * dist + "px", "--dy": Math.sin(ang) * dist + "px",
        "--s": rand(minS, maxS) + "px", "--r": rand(-220, 220) + "deg", "--t": t + "s"
      }, t, fx2);
    }
  }
  function poemExplosion(){
    const r = poemOverlay.querySelector(".poem-card").getBoundingClientRect();
    const top = Math.max(r.top, 0), bottom = Math.min(r.bottom, innerHeight);
    const x0 = r.left + r.width / 2, y0 = (top + bottom) / 2;
    popFrom(x0, y0, isSmall ? 36 : 60, 130, isSmall ? 280 : 460, 20, 42);

  function floatUp(){

  /* ---------- Confetti cannons (left & right) ---------- */
  const cv  = document.getElementById("confetti");
  const ctx = cv.getContext("2d");
  const COLORS = ["#ff5c8d","#ffd166","#06d6a0","#4cc9f0","#b388ff","#ff9ccb","#ffffff","#ff8fab","#ffb703"];
  let W = 0, H = 0, parts = [], looping = false;

  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  addEventListener("resize", resizeCanvas);

  function shoot(side){
    const left = side === "left";
    const x = left ? 8 : W - 8, y = H - 30;
    const scale = Math.max(.7, Math.min(1.2, H / 800));
    const n = isSmall ? 55 : 85;
    for (let i = 0; i < n; i++){
      const a = (Math.PI / 180) * rand(40, 80);            // angle up from the ground
      const sp = rand(11, 24) * scale;
      parts.push({
        x, y,
        vx: (left ? 1 : -1) * Math.cos(a) * sp,
        vy: -Math.sin(a) * sp,
        w: rand(6, 12), h: rand(3, 7),
        rot: rand(0, Math.PI * 2), vr: rand(-.3, .3),
        wob: rand(0, Math.PI * 2), vw: rand(.1, .3),
        color: pick(COLORS),
        round: Math.random() < .2
      });
    }
    // little 🎉 popper on that side
    const p = document.createElement("div");
    p.className = "popper " + (left ? "l" : "r");
    p.textContent = "🎉";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1800);
  }

  function tick(){
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.vx *= .985;
      p.vy = p.vy * .985 + .32;                            // gravity
      p.x += p.vx + Math.sin(p.wob) * .6;
      p.y += p.vy;
      p.rot += p.vr; p.wob += p.vw;
      if (p.y > H + 30){ parts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, Math.cos(p.wob));                       // flutter
      ctx.fillStyle = p.color;
      if (p.round){ ctx.beginPath(); ctx.arc(0, 0, p.h, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { looping = false; ctx.clearRect(0, 0, W, H); }
  }

  function fireConfetti(){
    [0, 350, 800, 1400].forEach(t => setTimeout(() => {
      shoot("left"); shoot("right");
      if (!looping){ looping = true; requestAnimationFrame(tick); }
    }, t));
  }

  surpriseBtn.addEventListener("click", () => {
    startMusicOnce();       // no-op if already playing or paused by the user

    surpriseBtn.classList.remove("pop"); void surpriseBtn.offsetWidth; surpriseBtn.classList.add("pop");
    surpriseBtn.classList.add("done");
    surpriseBtn.textContent = "💖 كل سنة وأنتِ طيبة 💖";

    // let the effects play first, then show the poem
    clearTimeout(poemTimer);
    poemTimer = setTimeout(openPoem, 1800);

    burstFromButton();
    balloons();
    fireConfetti();
    startRain();
  });
</script>
</body>
